<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Orçamento Pessoal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f4f8;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    h1 { color: #1a1a2e; font-size: 1.4rem; }
    p { color: #555; font-size: 1rem; }
    code { background: #f0f4f8; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💰 Simulador de Orçamento Pessoal</h1>
    <p>O programa será iniciado automaticamente.</p>
    <p>Abra o Console (<code>F12</code>) para ver os resultados detalhados.</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
